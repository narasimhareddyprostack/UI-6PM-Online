<html>
    <head>
        <title>Greet Labs Contact Page</title>
    </head>
    <body>
        <h4>Send Mail to US!</h4>
        <form action="/contact">
            Name: <input type="text"> <br>
            Email: <input type="email"> <br>
            Phone: <input type="number"> <br>
            Subject: <input type="text"> <br>
            Services: <select >
                        <option >Web Dev</option>
                        <option >Mobile App</option>
                        <option >Web Cloud</option>
                        <option >AI Agent Automation</option>
                      </select>
                    <br>
            Message: <textarea rows="5"></textarea>
            <br>
            <input type="submit" value="Submit Comment">
        </form>
    </body>
</html>
