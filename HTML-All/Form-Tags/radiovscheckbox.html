<html>
    <head>
        <title>Radio vs Check box</title>
    </head>
    <body>
        <h3>Registration Details</h3>
        <form action="/reg">

            <label >Emp Preferred Loc*:</label>
            <input type="checkbox">Bangalore
            <input type="checkbox">Mysore
            <input type="checkbox">USA
            <input type="checkbox">Singapore
            <br>
            <label >Gender</label>
            <input type="radio" name="gender_Value"> Male
            <input type="radio" name="gender_Value"> Female


        </form>
    </body>
</html>
