<html>

    <body>
        <h3>Vehicle - Challan Details</h3>
        <form action="/challan">
            <label >Mobile No:::::::::</label>
            <input type="text" required pattern="[6-9][0-9]{9}"/> <br><br>

            <label >Vehicle Number:</label>
            <input type="text" required pattern="^KA\s[0-9]{2}\s[a-zA-Z]{2}\s[0-9]{4}"/> <br>

            <input type="submit" value="Get">
        </form>
    </body>
</html>
